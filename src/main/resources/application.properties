# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=CivicShield

# ===========================
# DATABASE CONFIGURATION
# ===========================
# MySQL 8.0
spring.datasource.url=jdbc:mysql://localhost:3307/civicshield_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=civicshield123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ===========================
# THYMELEAF
# ===========================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ===========================
# FILE UPLOAD
# ===========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ===========================
# CIVICSHIELD APP SETTINGS
# ===========================
# Upload directory (relative to working directory)
app.upload.dir=uploads
app.upload.allowed-types=image/jpeg,image/png,image/webp
app.upload.max-size-bytes=10485760

# Admin bootstrap credentials (change these in production!)
app.admin.email=admin@civicshield.gov
app.admin.password=$2a$12$PLACEHOLDER_CHANGE_THIS_IN_PRODUCTION
app.admin.name=System Administrator

# Risk Score Thresholds
app.risk.low-max=24
app.risk.medium-max=49
app.risk.high-max=74
# 75–100 = Critical

# Duplicate Detection
app.duplicate.geo-radius-meters=200
app.duplicate.similarity-threshold=0.4
app.duplicate.time-window-days=30

# Escalation
app.escalation.check-interval-ms=3600000
app.escalation.default-deadline-days=7

# ===========================
# GOOGLE OAUTH 2.0
# ===========================
# Replace with your actual credentials from Google Cloud Console
# spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
# spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
# spring.security.oauth2.client.registration.google.scope=email,profile
# spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===========================
# LOGGING
# ===========================
logging.level.com.civicshield=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===========================
# ACTUATOR
# ===========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
