# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Name
spring.application.name=CivicShield

# ===========================
# DATABASE CONFIGURATION
# ===========================
# Automatically supports Railway MySQL service (MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD)
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_JDBC_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:civicshield_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${MYSQLUSER:${MYSQL_USER:root}}
spring.datasource.password=${MYSQLPASSWORD:${MYSQL_PASSWORD:civicshield123}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===========================
# THYMELEAF
# ===========================
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ===========================
# FILE UPLOAD
# ===========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ===========================
# CIVICSHIELD APP SETTINGS
# ===========================
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.allowed-types=image/jpeg,image/png,image/webp
app.upload.max-size-bytes=10485760

# Admin bootstrap credentials
app.admin.email=${ADMIN_EMAIL:admin@civicshield.gov}
app.admin.password=${ADMIN_PASSWORD:$2a$12$LQv3c1yqBWVHxkd0LHAkCOYz6TnKr7vFHoFGQJW0Zig/tCOj4RXri}
app.admin.name=System Administrator

# Risk Score Thresholds
app.risk.low-max=24
app.risk.medium-max=49
app.risk.high-max=74

# Duplicate Detection
app.duplicate.geo-radius-meters=200
app.duplicate.similarity-threshold=0.4
app.duplicate.time-window-days=30

# Escalation
app.escalation.check-interval-ms=3600000
app.escalation.default-deadline-days=7

# ===========================
# LOGGING
# ===========================
logging.level.com.civicshield=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===========================
# ACTUATOR
# ===========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never


# Cloudinary persistent image storage (set CLOUDINARY_URL in Railway env vars)
cloudinary.url=${CLOUDINARY_URL:}
