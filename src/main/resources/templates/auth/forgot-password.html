<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forgot Password — CIVICSHIELD</title>
<link rel="stylesheet" th:href="@{/css/civicshield.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-left">
    <div class="auth-logo"><a th:href="@{/}"><img th:src="@{/images/civicshield-logo.png}" alt="CIVICSHIELD" style="background:#252B33;padding:8px;border-radius:8px;"></a></div>
    <h1 class="auth-title">Reset your password</h1>
    <p class="auth-subtitle">Enter your email and we'll send reset instructions.</p>
    <div th:if="${success}" class="alert alert-success"><i class="fa fa-check-circle"></i><span th:text="${success}"></span></div>
    <form th:action="@{/forgot-password}" method="post" th:unless="${success}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;"><i class="fa fa-paper-plane"></i> Send Reset Link</button>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--grey-dark);"><a th:href="@{/login}"><i class="fa fa-arrow-left"></i> Back to Sign In</a></p>
  </div>
  <div class="auth-right">
    <div class="auth-right-bg"></div>
    <div class="auth-right-content">
      <img th:src="@{/images/civicshield-logo.png}" alt="CIVICSHIELD" style="height:64px;width:auto;margin-bottom:28px;">
      <h2>Building Safer<br>Communities Together.</h2>
      <p>Report public infrastructure problems and follow their progress until they are fixed.</p>
    </div>
  </div>
</div>
</body>
</html>
