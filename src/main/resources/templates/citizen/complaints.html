<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Complaints — CIVICSHIELD</title>
<link rel="stylesheet" th:href="@{/css/civicshield.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><img th:src="@{/images/civicshield-logo.png}" alt="CIVICSHIELD"></div>
    <nav class="sidebar-nav">
      <a th:href="@{/citizen/home}"><span class="nav-icon"><i class="fa fa-house"></i></span><span>Home</span></a>
      <a th:href="@{/citizen/report}"><span class="nav-icon"><i class="fa fa-plus-circle"></i></span><span>Report an Issue</span></a>
      <a th:href="@{/citizen/complaints}" class="active"><span class="nav-icon"><i class="fa fa-list"></i></span><span>My Complaints</span></a>
      <a th:href="@{/citizen/nearby}"><span class="nav-icon"><i class="fa fa-map-location-dot"></i></span><span>Nearby Issues</span></a>
      <a th:href="@{/citizen/alerts}"><span class="nav-icon"><i class="fa fa-bell"></i></span><span>Safety Alerts</span></a>
      <a th:href="@{/citizen/profile}"><span class="nav-icon"><i class="fa fa-user"></i></span><span>My Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.15);"><i class="fa fa-sign-out-alt"></i><span> Logout</span></button>
      </form>
    </div>
  </aside>
  <div class="dashboard-main">
    <div class="dashboard-topbar">
      <span class="topbar-title">My Complaints</span>
      <div class="topbar-right">
        <a th:href="@{/citizen/report}" class="btn btn-primary btn-sm"><i class="fa fa-plus"></i> New Report</a>
      </div>
    </div>
    <div class="dashboard-content">
      <div th:if="${success}" class="alert alert-success" style="margin-bottom:20px;"><i class="fa fa-check-circle"></i><span th:text="${success}"></span></div>
      <div th:if="${duplicateWarning}" class="alert alert-warning" style="margin-bottom:20px;"><i class="fa fa-triangle-exclamation"></i><span th:text="${duplicateWarning}"></span></div>

      <div class="table-wrapper">
        <div class="table-header">
          <h2>All My Reports</h2>
          <span style="font-size:13px;color:var(--grey-dark);" th:text="${complaints.size()} + ' total'"></span>
        </div>
        <div th:if="${#lists.isEmpty(complaints)}" class="table-empty">
          <i class="fa fa-clipboard-list" style="font-size:36px;margin-bottom:12px;display:block;"></i>
          <p>You have not submitted any reports yet.</p>
          <a th:href="@{/citizen/report}" class="btn btn-primary" style="margin-top:12px;"><i class="fa fa-plus"></i> Report an Issue</a>
        </div>
        <table th:unless="${#lists.isEmpty(complaints)}">
          <thead>
            <tr><th>Complaint ID</th><th>Issue Type</th><th>Location</th><th>Date</th><th>Priority</th><th>Status</th><th>Action</th></tr>
          </thead>
          <tbody>
            <tr th:each="c : ${complaints}">
              <td style="font-family:monospace;font-size:12px;font-weight:600;" th:text="${c.complaintId}"></td>
              <td th:text="${c.category.displayName}"></td>
              <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" th:text="${c.locationAddress != null ? c.locationAddress : '—'}"></td>
              <td style="white-space:nowrap;" th:text="${#temporals.format(c.createdAt,'dd MMM yyyy')}"></td>
              <td>
                <span th:if="${c.priority != null}" class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(c.priority.name())}" th:text="${c.priority.displayName}"></span>
                <span th:unless="${c.priority != null}" style="color:var(--grey-dark);font-size:13px;">Pending</span>
              </td>
              <td><span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(c.status.name())}" th:text="${c.status.displayName}"></span></td>
              <td><a th:href="@{/citizen/complaints/{id}(id=${c.id})}" class="btn btn-ghost btn-sm"><i class="fa fa-eye"></i> View</a></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
