<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Safety Alerts — CIVICSHIELD</title>
<link rel="stylesheet" th:href="@{/css/civicshield.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><img th:src="@{/images/civicshield-logo.png}" alt="CIVICSHIELD"></div>
    <nav class="sidebar-nav">
      <a th:href="@{/citizen/home}"><span class="nav-icon"><i class="fa fa-house"></i></span><span>Home</span></a>
      <a th:href="@{/citizen/report}"><span class="nav-icon"><i class="fa fa-plus-circle"></i></span><span>Report an Issue</span></a>
      <a th:href="@{/citizen/complaints}"><span class="nav-icon"><i class="fa fa-list"></i></span><span>My Complaints</span></a>
      <a th:href="@{/citizen/nearby}"><span class="nav-icon"><i class="fa fa-map-location-dot"></i></span><span>Nearby Issues</span></a>
      <a th:href="@{/citizen/alerts}" class="active"><span class="nav-icon"><i class="fa fa-bell"></i></span><span>Safety Alerts</span></a>
      <a th:href="@{/citizen/profile}"><span class="nav-icon"><i class="fa fa-user"></i></span><span>My Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.15);"><i class="fa fa-sign-out-alt"></i><span> Logout</span></button>
      </form>
    </div>
  </aside>
  <div class="dashboard-main">
    <div class="dashboard-topbar"><span class="topbar-title">Safety Alerts</span></div>
    <div class="dashboard-content">
      <div th:if="${#lists.isEmpty(alerts)}" class="card">
        <div class="card-body" style="text-align:center;padding:48px;">
          <i class="fa fa-shield-halved" style="font-size:48px;color:var(--grey-dark);margin-bottom:12px;display:block;"></i>
          <p style="color:var(--grey-dark);">No active safety alerts in your area.</p>
        </div>
      </div>
      <div th:each="alert : ${alerts}" style="margin-bottom:16px;">
        <div class="card">
          <div class="card-body">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;">
              <div>
                <div style="font-weight:700;font-size:15px;margin-bottom:4px;" th:text="${alert.title}"></div>
                <div style="font-size:13px;color:var(--grey-dark);" th:if="${alert.location != null}" th:text="${alert.location}"></div>
              </div>
              <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">
                <span th:if="${alert.priority != null}" class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(alert.priority.name())}" th:text="${alert.priority.displayName}"></span>
                <span style="font-size:12px;color:var(--grey-dark);" th:text="${#temporals.format(alert.createdAt,'dd MMM yyyy')}"></span>
              </div>
            </div>
            <p style="font-size:14px;line-height:1.6;margin-bottom:10px;" th:text="${alert.description}"></p>
            <div th:if="${alert.safetyInstructions != null}" class="alert alert-warning" style="margin-bottom:0;">
              <i class="fa fa-triangle-exclamation"></i>
              <span th:text="${alert.safetyInstructions}"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
