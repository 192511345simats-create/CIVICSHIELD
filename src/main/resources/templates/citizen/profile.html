<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Profile — CIVICSHIELD</title>
<link rel="stylesheet" th:href="@{/css/civicshield.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><img th:src="@{/images/civicshield-logo.png}" alt="CIVICSHIELD"></div>
    <nav class="sidebar-nav">
      <a th:href="@{/citizen/home}"><span class="nav-icon"><i class="fa fa-house"></i></span><span>Home</span></a>
      <a th:href="@{/citizen/report}"><span class="nav-icon"><i class="fa fa-plus-circle"></i></span><span>Report an Issue</span></a>
      <a th:href="@{/citizen/complaints}"><span class="nav-icon"><i class="fa fa-list"></i></span><span>My Complaints</span></a>
      <a th:href="@{/citizen/nearby}"><span class="nav-icon"><i class="fa fa-map-location-dot"></i></span><span>Nearby Issues</span></a>
      <a th:href="@{/citizen/alerts}"><span class="nav-icon"><i class="fa fa-bell"></i></span><span>Safety Alerts</span></a>
      <a th:href="@{/citizen/profile}" class="active"><span class="nav-icon"><i class="fa fa-user"></i></span><span>My Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.15);"><i class="fa fa-sign-out-alt"></i><span> Logout</span></button>
      </form>
    </div>
  </aside>
  <div class="dashboard-main">
    <div class="dashboard-topbar"><span class="topbar-title">My Profile</span></div>
    <div class="dashboard-content">
      <div th:if="${success}" class="alert alert-success" style="margin-bottom:20px;"><i class="fa fa-check-circle"></i><span th:text="${success}"></span></div>
      <div th:if="${error}" class="alert alert-danger" style="margin-bottom:20px;"><i class="fa fa-circle-exclamation"></i><span th:text="${error}"></span></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:860px;">
        <!-- Profile update -->
        <div class="card">
          <div class="card-header"><span class="card-title">Personal Information</span></div>
          <div class="card-body">
            <form th:action="@{/citizen/profile/update}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <div class="form-group"><label>Full Name</label><input type="text" name="fullName" class="form-control" required th:value="${user.fullName}"></div>
              <div class="form-group"><label>Email Address</label><input type="email" class="form-control" th:value="${user.email}" disabled style="background:var(--grey);"><div class="form-hint">Email cannot be changed.</div></div>
              <div class="form-group"><label>Mobile Number</label><input type="tel" name="mobile" class="form-control" th:value="${user.mobile}" placeholder="10-digit number"></div>
              <div class="form-group"><label>Account Type</label><div class="chip chip-info" th:text="${user.role.name()}"></div></div>
              <button type="submit" class="btn btn-primary btn-sm"><i class="fa fa-save"></i> Save Changes</button>
            </form>
          </div>
        </div>

        <!-- Change password -->
        <div class="card" th:if="${user.provider.name() == 'LOCAL'}">
          <div class="card-header"><span class="card-title">Change Password</span></div>
          <div class="card-body">
            <form th:action="@{/citizen/profile/change-password}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <div class="form-group"><label>Current Password</label>
                <div class="input-group"><input type="password" name="currentPassword" id="cp" class="form-control" required><button type="button" class="input-toggle" onclick="tp('cp',this)"><i class="fa fa-eye"></i></button></div>
              </div>
              <div class="form-group"><label>New Password</label>
                <div class="input-group"><input type="password" name="newPassword" id="np" class="form-control" required minlength="8"><button type="button" class="input-toggle" onclick="tp('np',this)"><i class="fa fa-eye"></i></button></div>
              </div>
              <div class="form-group"><label>Confirm New Password</label>
                <div class="input-group"><input type="password" name="confirmNewPassword" id="cnp" class="form-control" required><button type="button" class="input-toggle" onclick="tp('cnp',this)"><i class="fa fa-eye"></i></button></div>
              </div>
              <button type="submit" class="btn btn-dark btn-sm"><i class="fa fa-lock"></i> Change Password</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>function tp(id,btn){var f=document.getElementById(id),i=btn.querySelector('i');if(f.type==='password'){f.type='text';i.className='fa fa-eye-slash';}else{f.type='password';i.className='fa fa-eye';}}</script>
</body>
</html>
