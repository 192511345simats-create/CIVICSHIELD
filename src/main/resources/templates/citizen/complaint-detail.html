<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Complaint Details — CIVICSHIELD</title>
<link rel="stylesheet" th:href="@{/css/civicshield.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><img th:src="@{/images/civicshield-logo.png}" alt="CIVICSHIELD"></div>
    <nav class="sidebar-nav">
      <a th:href="@{/citizen/home}"><span class="nav-icon"><i class="fa fa-house"></i></span><span>Home</span></a>
      <a th:href="@{/citizen/report}"><span class="nav-icon"><i class="fa fa-plus-circle"></i></span><span>Report an Issue</span></a>
      <a th:href="@{/citizen/complaints}" class="active"><span class="nav-icon"><i class="fa fa-list"></i></span><span>My Complaints</span></a>
      <a th:href="@{/citizen/nearby}"><span class="nav-icon"><i class="fa fa-map-location-dot"></i></span><span>Nearby Issues</span></a>
      <a th:href="@{/citizen/alerts}"><span class="nav-icon"><i class="fa fa-bell"></i></span><span>Safety Alerts</span></a>
      <a th:href="@{/citizen/profile}"><span class="nav-icon"><i class="fa fa-user"></i></span><span>My Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.15);"><i class="fa fa-sign-out-alt"></i><span> Logout</span></button>
      </form>
    </div>
  </aside>
  <div class="dashboard-main">
    <div class="dashboard-topbar">
      <a th:href="@{/citizen/complaints}" style="color:var(--grey-dark);font-size:14px;"><i class="fa fa-arrow-left"></i></a>
      <span class="topbar-title" th:text="${complaint.complaintId}"></span>
      <div class="topbar-right">
        <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(complaint.status.name())}" th:text="${complaint.status.displayName}"></span>
      </div>
    </div>
    <div class="dashboard-content">
      <div style="display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;">

        <!-- Main info -->
        <div>
          <div class="card" style="margin-bottom:16px;">
            <div class="card-header"><span class="card-title">Report Details</span></div>
            <div class="card-body">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div><div style="font-size:12px;font-weight:600;text-transform:uppercase;color:var(--grey-dark);margin-bottom:4px;">Issue Type</div><div th:text="${complaint.category.displayName}"></div></div>
                <div><div style="font-size:12px;font-weight:600;text-transform:uppercase;color:var(--grey-dark);margin-bottom:4px;">Submitted</div><div th:text="${#temporals.format(complaint.createdAt,'dd MMM yyyy HH:mm')}"></div></div>
                <div><div style="font-size:12px;font-weight:600;text-transform:uppercase;color:var(--grey-dark);margin-bottom:4px;">Location</div><div th:text="${complaint.locationAddress != null ? complaint.locationAddress : '—'}"></div></div>
                <div><div style="font-size:12px;font-weight:600;text-transform:uppercase;color:var(--grey-dark);margin-bottom:4px;">Priority</div>
                  <span th:if="${complaint.priority != null}" class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(complaint.priority.name())}" th:text="${complaint.priority.displayName}"></span>
                  <span th:unless="${complaint.priority != null}" style="color:var(--grey-dark);">Not assessed yet</span>
                </div>
              </div>
              <div style="margin-top:16px;"><div style="font-size:12px;font-weight:600;text-transform:uppercase;color:var(--grey-dark);margin-bottom:6px;">Description</div><p style="font-size:14px;line-height:1.6;" th:text="${complaint.description}"></p></div>
              <!-- Map -->
              <div th:if="${complaint.latitude != null}" style="margin-top:16px;">
                <div style="font-size:12px;font-weight:600;text-transform:uppercase;color:var(--grey-dark);margin-bottom:6px;">Location on Map</div>
                <div id="detail-map" style="height:200px;border-radius:var(--radius);"></div>
              </div>
            </div>
          </div>

          <!-- Photo -->
          <div class="card" style="margin-bottom:16px;" th:if="${complaint.imagePath != null}">
            <div class="card-header"><span class="card-title">Photo</span></div>
            <div class="card-body">
              <img th:src="@{/uploads/{path}(path=${complaint.imagePath})}" alt="Complaint photo" style="max-width:100%;border-radius:var(--radius);max-height:320px;object-fit:cover;">
            </div>
          </div>

          <!-- Assignment info -->
          <div class="card" th:if="${assignment != null}">
            <div class="card-header"><span class="card-title">Repair Assignment</span></div>
            <div class="card-body">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div><div style="font-size:12px;font-weight:600;color:var(--grey-dark);margin-bottom:4px;">Department</div><div th:text="${assignment.department.name}"></div></div>
                <div><div style="font-size:12px;font-weight:600;color:var(--grey-dark);margin-bottom:4px;">Worker</div><div th:text="${assignment.workerName != null ? assignment.workerName : 'Not assigned'}"></div></div>
                <div><div style="font-size:12px;font-weight:600;color:var(--grey-dark);margin-bottom:4px;">Target Date</div><div th:text="${assignment.deadline != null ? #temporals.format(assignment.deadline,'dd MMM yyyy') : '—'}"></div></div>
                <div><div style="font-size:12px;font-weight:600;color:var(--grey-dark);margin-bottom:4px;">Assignment Status</div><div th:text="${assignment.status.name()}"></div></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Timeline sidebar -->
        <div>
          <div class="card">
            <div class="card-header"><span class="card-title">Progress</span></div>
            <div class="card-body">
              <div class="timeline" th:if="${!#lists.isEmpty(timeline)}">
                <div class="timeline-item" th:each="u : ${timeline}">
                  <div class="timeline-dot"></div>
                  <div class="timeline-time" th:text="${#temporals.format(u.updatedAt,'dd MMM yyyy HH:mm')}"></div>
                  <div class="timeline-title" th:text="${u.newStatus.displayName}"></div>
                  <div class="timeline-note" th:if="${u.notes != null}" th:text="${u.notes}"></div>
                </div>
              </div>
              <div th:if="${#lists.isEmpty(timeline)}" style="color:var(--grey-dark);font-size:14px;">No updates yet.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:if="${complaint.latitude != null}">
  var map = L.map('detail-map').setView([[[${complaint.latitude}]], [[${complaint.longitude}]]], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
  L.marker([[[${complaint.latitude}]], [[${complaint.longitude}]]]).addTo(map).bindPopup('[[${complaint.category.displayName}]]').openPopup();
</script>
</body>
</html>
