<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nearby Issues — CIVICSHIELD</title>
<link rel="stylesheet" th:href="@{/css/civicshield.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><img th:src="@{/images/civicshield-logo.png}" alt="CIVICSHIELD"></div>
    <nav class="sidebar-nav">
      <a th:href="@{/citizen/home}"><span class="nav-icon"><i class="fa fa-house"></i></span><span>Home</span></a>
      <a th:href="@{/citizen/report}"><span class="nav-icon"><i class="fa fa-plus-circle"></i></span><span>Report an Issue</span></a>
      <a th:href="@{/citizen/complaints}"><span class="nav-icon"><i class="fa fa-list"></i></span><span>My Complaints</span></a>
      <a th:href="@{/citizen/nearby}" class="active"><span class="nav-icon"><i class="fa fa-map-location-dot"></i></span><span>Nearby Issues</span></a>
      <a th:href="@{/citizen/alerts}"><span class="nav-icon"><i class="fa fa-bell"></i></span><span>Safety Alerts</span></a>
      <a th:href="@{/citizen/profile}"><span class="nav-icon"><i class="fa fa-user"></i></span><span>My Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.15);"><i class="fa fa-sign-out-alt"></i><span> Logout</span></button>
      </form>
    </div>
  </aside>
  <div class="dashboard-main">
    <div class="dashboard-topbar">
      <span class="topbar-title">Nearby Issues</span>
      <div class="topbar-right"><a th:href="@{/citizen/report}" class="btn btn-primary btn-sm"><i class="fa fa-plus"></i> Report an Issue</a></div>
    </div>
    <div class="dashboard-content">
      <div th:if="${success}" class="alert alert-success" style="margin-bottom:20px;"><i class="fa fa-check-circle"></i><span th:text="${success}"></span></div>
      <div th:if="${info}" class="alert alert-info" style="margin-bottom:20px;"><i class="fa fa-circle-info"></i><span th:text="${info}"></span></div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Infrastructure Issues Map</span>
          <span style="font-size:13px;color:var(--grey-dark);">Click a marker to see details</span>
        </div>
        <div id="nearby-map" style="height:520px;border-radius:0 0 8px 8px;"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
var complaints = [[${complaintsJson}]];

var map = L.map('nearby-map').setView([20.5937, 78.9629], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);

var priorityColors = {Critical:'#C8202F', High:'#f97316', Medium:'#f59e0b', Low:'#22c55e', '':'#6b7280'};

complaints.forEach(function(c){
  if(!c.lat || !c.lng) return;
  var color = priorityColors[c.priority] || '#6b7280';
  var icon = L.divIcon({
    html: '<div style="width:16px;height:16px;border-radius:50%;background:' + color + ';border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);"></div>',
    className: '', iconSize:[16,16], iconAnchor:[8,8]
  });
  var popup = '<div style="font-size:13px;min-width:160px;">'
    + '<strong>' + c.category + '</strong><br>'
    + (c.address ? '<span style="color:#6b7280;">' + c.address + '</span><br>' : '')
    + '<span class="badge" style="margin-top:4px;display:inline-block;">' + c.status + '</span>'
    + (c.priority ? ' <span style="font-size:11px;color:' + color + ';font-weight:600;">' + c.priority + '</span>' : '')
    + '</div>';
  L.marker([c.lat, c.lng], {icon:icon}).addTo(map).bindPopup(popup);
});

// Try to show user location
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(function(p){
    var userIcon = L.divIcon({
      html:'<div style="width:14px;height:14px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 2px 8px rgba(59,130,246,.5);"></div>',
      className:'', iconSize:[14,14], iconAnchor:[7,7]
    });
    L.marker([p.coords.latitude, p.coords.longitude], {icon:userIcon}).addTo(map).bindPopup('<strong>Your location</strong>');
    map.setView([p.coords.latitude, p.coords.longitude], 13);
  });
}
</script>
</body>
</html>
