<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Report an Issue — CIVICSHIELD</title>
<link rel="stylesheet" th:href="@{/css/civicshield.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><img th:src="@{/images/civicshield-logo.png}" alt="CIVICSHIELD"></div>
    <nav class="sidebar-nav">
      <a th:href="@{/citizen/home}"><span class="nav-icon"><i class="fa fa-house"></i></span><span>Home</span></a>
      <a th:href="@{/citizen/report}" class="active"><span class="nav-icon"><i class="fa fa-plus-circle"></i></span><span>Report an Issue</span></a>
      <a th:href="@{/citizen/complaints}"><span class="nav-icon"><i class="fa fa-list"></i></span><span>My Complaints</span></a>
      <a th:href="@{/citizen/nearby}"><span class="nav-icon"><i class="fa fa-map-location-dot"></i></span><span>Nearby Issues</span></a>
      <a th:href="@{/citizen/alerts}"><span class="nav-icon"><i class="fa fa-bell"></i></span><span>Safety Alerts</span></a>
      <a th:href="@{/citizen/profile}"><span class="nav-icon"><i class="fa fa-user"></i></span><span>My Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.15);"><i class="fa fa-sign-out-alt"></i><span> Logout</span></button>
      </form>
    </div>
  </aside>

  <div class="dashboard-main">
    <div class="dashboard-topbar">
      <span class="topbar-title">Report an Issue</span>
      <div class="topbar-right"><span style="font-size:14px;color:var(--grey-dark);" th:text="${user.fullName}"></span></div>
    </div>

    <div class="dashboard-content">
      <div th:if="${error}" class="alert alert-danger" style="margin-bottom:20px;"><i class="fa fa-circle-exclamation"></i><span th:text="${error}"></span></div>
      <div th:if="${param.error}" class="alert alert-danger" style="margin-bottom:20px;"><i class="fa fa-circle-exclamation"></i><span>File upload failed. Please upload a JPEG, PNG or WebP image under 10 MB.</span></div>

      <div class="card" style="max-width:720px;">
        <div class="card-header"><span class="card-title"><i class="fa fa-plus-circle" style="color:var(--red);"></i> New Report</span></div>
        <div class="card-body">
          <form th:action="@{/citizen/report}" method="post" enctype="multipart/form-data" th:object="${dto}" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Issue Type -->
            <div class="form-group">
              <label>Issue Type <span class="required">*</span></label>
              <select name="category" class="form-control" required th:field="*{category}">
                <option value="">— Select issue type —</option>
                <option th:each="cat : ${categories}" th:value="${cat.name()}" th:text="${cat.displayName}"></option>
              </select>
              <div class="form-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
            </div>

            <!-- Photo Upload -->
            <div class="form-group">
              <label>Upload Photo</label>
              <div class="upload-zone" id="uploadZone" onclick="document.getElementById('image').click()">
                <div class="upload-icon"><i class="fa fa-camera"></i></div>
                <p><strong>Click to upload</strong> or drag a photo here</p>
                <p style="font-size:12px;margin-top:4px;">JPEG, PNG or WebP — max 10 MB</p>
              </div>
              <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/webp" style="display:none;" onchange="previewImage(this)">
              <img id="image-preview" src="" alt="Preview">
            </div>

            <!-- Location -->
            <div class="form-group">
              <label>Location</label>
              <div style="display:flex;gap:8px;margin-bottom:8px;">
                <button type="button" class="btn btn-outline btn-sm" onclick="getLocation()"><i class="fa fa-location-crosshairs"></i> Use My Location</button>
                <span id="location-status" style="font-size:13px;color:var(--grey-dark);align-self:center;"></span>
              </div>
              <div id="location-map" style="height:220px;border-radius:var(--radius);margin-bottom:8px;"></div>
              <input type="hidden" id="latitude"  name="latitude"  th:field="*{latitude}">
              <input type="hidden" id="longitude" name="longitude" th:field="*{longitude}">
              <input type="text" name="locationAddress" class="form-control" placeholder="Address or landmark (optional)" th:field="*{locationAddress}" style="margin-bottom:6px;">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <input type="text" name="ward"     class="form-control" placeholder="Ward (optional)"     th:field="*{ward}">
                <input type="text" name="district" class="form-control" placeholder="District (optional)" th:field="*{district}">
              </div>
            </div>

            <!-- Description -->
            <div class="form-group">
              <label>Description <span class="required">*</span></label>
              <textarea name="description" class="form-control" rows="4" placeholder="Describe the problem clearly. What did you see? How serious is it?" required maxlength="500" th:field="*{description}"></textarea>
              <div class="form-hint">Maximum 500 characters.</div>
              <div class="form-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;"><i class="fa fa-paper-plane"></i> Submit Report</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('location-map').setView([20.5937, 78.9629], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
var marker = null;

map.on('click', function(e){
  setLocation(e.latlng.lat, e.latlng.lng);
});

function setLocation(lat, lng){
  document.getElementById('latitude').value = lat.toFixed(6);
  document.getElementById('longitude').value = lng.toFixed(6);
  document.getElementById('location-status').textContent = 'Location selected: ' + lat.toFixed(4) + ', ' + lng.toFixed(4);
  if(marker) map.removeLayer(marker);
  marker = L.marker([lat, lng]).addTo(map);
  map.setView([lat, lng], 15);
}

function getLocation(){
  var s = document.getElementById('location-status');
  s.textContent = 'Getting your location…';
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(p){
      setLocation(p.coords.latitude, p.coords.longitude);
    }, function(){
      s.textContent = 'Location access denied. Please click on the map or enter address manually.';
    });
  } else {
    s.textContent = 'Geolocation is not supported by your browser.';
  }
}

function previewImage(input){
  var zone = document.getElementById('uploadZone');
  var prev = document.getElementById('image-preview');
  if(input.files && input.files[0]){
    var reader = new FileReader();
    reader.onload = function(e){ prev.src = e.target.result; prev.style.display='block'; };
    reader.readAsDataURL(input.files[0]);
    zone.style.borderColor='var(--red)';
  }
}

// Drag and drop
var zone = document.getElementById('uploadZone');
zone.addEventListener('dragover', function(e){ e.preventDefault(); zone.classList.add('active'); });
zone.addEventListener('dragleave', function(){ zone.classList.remove('active'); });
zone.addEventListener('drop', function(e){
  e.preventDefault(); zone.classList.remove('active');
  var file = e.dataTransfer.files[0];
  if(file){ document.getElementById('image').files = e.dataTransfer.files; previewImage(document.getElementById('image')); }
});
</script>
</body>
</html>
